# Run from the repository root:
# ./build/Debug/sipi-2 --config examples/native/sipi.toml
# Relative paths are based on the process working directory, not this file.
listen-address = "127.0.0.1"
port = 18080
iiif-root = "examples/images"
public-base-url = "http://127.0.0.1:18080"
iiif-workers = 2
log-level = "info"

# Optional dedicated persistent cache; keep it separate from source images.
# cache-dir = "build/native-demo-cache"
# No Lua policy is enabled: supported files in the example repository are public.
