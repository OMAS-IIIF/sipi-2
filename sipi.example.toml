# Log severity: trace, debug, info, warn, error, critical, off.
log-level = "info"

# Local plain-HTTP listener (HTTPS is provided by the reverse proxy).
port = 8080

# Public origin; add a mount path only if the proxy strips it before forwarding.
# Defaults to http://127.0.0.1:<port>. Host/Forwarded headers never override it.
# public-base-url = "https://images.example.org"

# Permit actual IIIF enlargement when the request explicitly uses ^.
size-upscaling = false

# Shared JPEG/PNG output limits before rotation; source dimensions stay unchanged.
# Axes: 1..32768. Area: 1..8388608 pixels. No unlimited value.
max-width = 8192
# Omit max-height to inherit the effective max-width (including CLI/env overrides).
# max-height = 8192
max-area = 8388608

# Bitonal output: threshold or floyd-steinberg (per-request diffusion; tile patterns may differ).
bitonal-method = "threshold"

# Optional trusted Lua policy; relative paths use the process working directory.
# Startup validates the script; IIIF GET/HEAD requests execute it before source lookup.
# preflight-script = "examples/preflight.lua"

# Optional existing image repository, relative to the process working directory.
# Default identifier mapping and relative Lua source paths use this directory.
# iiif-root = "data/images"

# Optional explicit S3 credentials. Omit all three to use the AWS SDK provider chain.
# Each field follows CLI > SIPI_S3_* environment > TOML > absent.
# Access and secret keys must both be present; a session token requires that pair.
# Example values below are PUBLIC local MinIO test credentials only.
# s3-access-key = "sipi-test"
# s3-secret-key = "sipi-local-test-password"
# s3-session-token = "temporary-session-token"

# Default mapping: local (default) or s3. S3 requires s3-bucket.
# The IIIF URL prefix NEVER participates in default mapping; only identifier does.
# Project-specific prefix translation belongs in the preflight script.
# iiif-storage = "s3"
# s3-bucket = "sipi-test-images"
# s3-region = "us-east-1"
# s3-endpoint = "http://127.0.0.1:9000"  # Omit for AWS regional endpoint; no trailing slash.
# s3-path-style = true                  # Default false; use true for local MinIO.

# Optional persistent encoded-result storage. Separate from the image repository.
# CLI > SIPI_CACHE_* environment > TOML > defaults. Relative to the working directory.
# JPEG/PNG delivery reuses complete results after authorization/source checks.
# Database name inside this directory is fixed: cache.sqlite3.
# cache-dir = "data/cache"
# cache-max-bytes = 1073741824       # 1 GiB of encoded files; DB/overhead additional.
# cache-target-percent = 90         # On overflow, reclaim LRU bytes to this target.

# In-memory metadata cache, independent of cache-dir. Either 0 disables retention.
# CLI > SIPI_METADATA_CACHE_* environment > TOML > defaults below.
# metadata-cache-max-entries = 256
# metadata-cache-max-bytes = 67108864  # 64 MiB accounted metadata storage.

# Optional override: 1..32 processing workers. If omitted, detected CPUs capped at 4.
# More workers multiply per-request memory; this is not an RSS budget.
# iiif-workers = 4

# Public CORS by default. Cookie-based cross-origin viewers require explicit origins.
cors-origins = "*"
cors-credentials = false
# Example: cors-origins = "https://viewer.example,https://catalog.example"
# Then set cors-credentials = true. See docs/iiif-http.md.
